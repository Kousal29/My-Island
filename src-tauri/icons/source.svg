<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1830"/>
      <stop offset="1" stop-color="#08080c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#8b7bff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#5b8cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c24"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9a8ff"/>
      <stop offset="1" stop-color="#5fe3d0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- squircle -->
  <rect x="48" y="48" width="928" height="928" rx="232" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="232" fill="url(#glow)"/>
  <rect x="49.5" y="49.5" width="925" height="925" rx="230.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- island shadow -->
  <rect x="242" y="438" width="540" height="196" rx="98" fill="#000" opacity="0.6" filter="url(#soft)"/>

  <!-- cat ears peeking over the island -->
  <path d="M352 432 L382 300 Q388 280 404 294 L478 392 Z" fill="#0b0b10"/>
  <path d="M672 432 L642 300 Q636 280 620 294 L546 392 Z" fill="#0b0b10"/>
  <path d="M384 404 L398 330 L446 392 Z" fill="#ff8fb0" opacity="0.85"/>
  <path d="M640 404 L626 330 L578 392 Z" fill="#ff8fb0" opacity="0.85"/>

  <!-- the island -->
  <rect x="232" y="392" width="560" height="196" rx="98" fill="url(#pill)"/>
  <rect x="232" y="392" width="560" height="196" rx="98" fill="url(#rim)"/>
  <rect x="233.5" y="393.5" width="557" height="193" rx="96.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3"/>

  <!-- eyes -->
  <ellipse cx="430" cy="490" rx="44" ry="50" fill="url(#eye)"/>
  <ellipse cx="594" cy="490" rx="44" ry="50" fill="url(#eye)"/>
  <ellipse cx="438" cy="496" rx="15" ry="32" fill="#08080c"/>
  <ellipse cx="602" cy="496" rx="15" ry="32" fill="#08080c"/>
  <circle cx="447" cy="470" r="9" fill="#fff"/>
  <circle cx="611" cy="470" r="9" fill="#fff"/>

  <!-- little smile -->
  <path d="M494 548 Q512 562 530 548" stroke="#ff8fb0" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- soft reflection under the island -->
  <rect x="352" y="694" width="320" height="22" rx="11" fill="#8b7bff" opacity="0.35"/>
  <rect x="422" y="742" width="180" height="14" rx="7" fill="#5fe3d0" opacity="0.22"/>
</svg>
